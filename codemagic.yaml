workflows:
  ios-release:
    name: Rota Dünya - iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pudinglabs.rotaturkiye
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter paketlerini hazırla
        script: flutter pub get
      - name: CocoaPods paketlerini kur
        script: |
          cd ios
          pod install
      - name: Kod kalitesini denetle
        script: flutter analyze
      - name: Testleri çalıştır
        script: flutter test
      - name: iOS imzalama profilini uygula
        script: xcode-project use-profiles
      - name: App Store IPA dosyasını oluştur
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
