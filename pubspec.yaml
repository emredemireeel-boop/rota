name: rota
description: "Rota Dünya - Türkiye ve dünya seyahat anıları uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  countries_world_map: ^1.3.0
  turkiye_regional_map: ^0.0.1
  district_picker_turkey_map: ^0.1.10
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  geocoding: ^5.0.0
  video_player: ^2.11.1
  gal: ^2.3.2
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
